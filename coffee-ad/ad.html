<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:ital,wght@1,600;1,800&family=Inter:wght@500;700;900&display=block" rel="stylesheet">
<style>
:root{--g:#1f8a4c;--g2:#2fd27a;--deep:#03100a;--ink:#000;}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;background:var(--deep);font-family:Inter,sans-serif}
.ad{position:relative;width:1080px;height:1350px;overflow:hidden;
  background:
   radial-gradient(ellipse 560px 620px at 50% 58%, rgba(47,210,122,.42), rgba(31,138,76,.16) 45%, transparent 72%),
   radial-gradient(ellipse 900px 500px at 100% 0%, rgba(31,138,76,.35), transparent 60%),
   radial-gradient(ellipse 700px 500px at 0% 100%, rgba(31,138,76,.28), transparent 65%),
   linear-gradient(170deg,#06180f 0%,#020805 55%,#000 100%);}
/* arch window */
.arch{position:absolute;left:50%;top:300px;transform:translateX(-50%);width:640px;height:900px;
  border-radius:320px 320px 0 0;background:linear-gradient(180deg,rgba(47,210,122,.18),rgba(10,40,22,.05));
  border:2px solid rgba(47,210,122,.35);border-bottom:none;box-shadow:inset 0 0 120px rgba(47,210,122,.12)}
.arch2{position:absolute;left:50%;top:270px;transform:translateX(-50%);width:700px;height:960px;
  border-radius:350px 350px 0 0;border:1px solid rgba(47,210,122,.15);border-bottom:none}
/* leaf shadows */
.leaves{position:absolute;inset:0;opacity:.55;filter:blur(7px)}
.grain{position:absolute;inset:-50%;opacity:.13;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.big{position:absolute;top:130px;left:0;right:0;text-align:center;font-family:Anton,sans-serif;font-size:290px;line-height:1;letter-spacing:4px;
  color:#eafff2;text-shadow:0 0 70px rgba(47,210,122,.45);}
.big.out{top:-150px;color:transparent;-webkit-text-stroke:2px rgba(47,210,122,.25);text-shadow:none}
.top{position:absolute;top:56px;left:64px;right:64px;display:flex;justify-content:space-between;align-items:center;color:#d8f5e4;font-weight:700;letter-spacing:6px;font-size:22px}
.pill{border:2px solid var(--g2);color:var(--g2);padding:10px 22px;border-radius:40px;letter-spacing:3px;font-size:20px}
.cupwrap{position:absolute;left:50%;top:340px;transform:translateX(-50%) rotate(-4deg);width:475px}
.cupwrap img{width:100%;display:block;filter:drop-shadow(0 40px 50px rgba(0,0,0,.75)) drop-shadow(0 0 40px rgba(47,210,122,.25))}
.floor{position:absolute;left:50%;top:1040px;transform:translateX(-50%);width:460px;height:60px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.9),transparent 70%);filter:blur(6px)}
.script{position:absolute;top:1055px;left:0;right:0;text-align:center;font-family:'Playfair Display',serif;font-style:italic;font-weight:800;font-size:112px;color:#fff;
  text-shadow:0 6px 30px rgba(0,0,0,.8)}
.script span{color:var(--g2)}
.tag{position:absolute;bottom:52px;left:64px;color:#bfe9cf;font-size:24px;font-weight:500;letter-spacing:1px;line-height:1.45}
.tag b{color:#fff;font-weight:900;letter-spacing:5px;font-size:20px;display:block;margin-bottom:4px}
.cta{position:absolute;bottom:52px;right:64px;background:var(--g2);color:#000;font-weight:900;font-size:24px;letter-spacing:3px;padding:20px 34px;border-radius:60px;box-shadow:0 0 40px rgba(47,210,122,.55)}
.price{position:absolute;top:500px;right:70px;width:220px;height:220px;border-radius:50%;background:#000;border:4px solid var(--g2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(10deg);
  box-shadow:0 0 0 10px rgba(47,210,122,.12),0 20px 50px rgba(0,0,0,.7)}
.price small{color:var(--g2);font-weight:900;letter-spacing:5px;font-size:20px}
.price strong{font-family:Anton,sans-serif;color:#fff;font-size:68px;line-height:1;margin-top:6px;letter-spacing:1px}
.price strong em{font-style:normal;color:var(--g2);font-size:52px;margin-left:4px}
.sticker{position:absolute;top:640px;left:60px;transform:rotate(-8deg);background:#eafff2;color:#000;font-weight:900;font-size:22px;letter-spacing:2px;padding:14px 22px;border-radius:12px;box-shadow:6px 6px 0 var(--g)}
.bean{position:absolute}
</style></head><body>
<div class="ad">
  <svg class="leaves" viewBox="0 0 1080 1350" width="1080" height="1350">
    <defs><g id="leaf"><path d="M0 0 C60 -40 180 -40 260 0 C180 40 60 40 0 0Z" fill="#000"/></g></defs>
    <g opacity=".9">
      <g transform="translate(-40 120) rotate(25)"><use href="#leaf"/><g transform="translate(120 -10) rotate(-35)"><use href="#leaf"/></g><g transform="translate(90 20) rotate(40)"><use href="#leaf"/></g></g>
      <g transform="translate(1120 900) rotate(200)"><use href="#leaf"/><g transform="translate(130 -10) rotate(-30)"><use href="#leaf"/></g><g transform="translate(100 20) rotate(35)"><use href="#leaf"/></g><g transform="translate(230 0) rotate(10)"><use href="#leaf"/></g></g>
      <g transform="translate(1100 260) rotate(160) scale(.8)"><use href="#leaf"/><g transform="translate(120 10) rotate(30)"><use href="#leaf"/></g></g>
    </g>
  </svg>
  <div class="arch2"></div>
  <div class="arch"></div>

  <div class="top"><span>COMO · COFFEE</span><span class="pill">NEW · ICED</span></div>

  <div class="big">FREDDO</div>

  <!-- background beans (blurred) -->
  <svg class="bean" style="left:150px;top:860px;filter:blur(3px);opacity:.8" width="90" height="70" viewBox="0 0 90 70"><ellipse cx="45" cy="35" rx="42" ry="30" fill="#3a2316" transform="rotate(-20 45 35)"/><path d="M14 46 C35 30 50 42 76 22" stroke="#140a05" stroke-width="5" fill="none" stroke-linecap="round"/></svg>
  <svg class="bean" style="left:850px;top:820px;filter:blur(2px);opacity:.85" width="80" height="62" viewBox="0 0 90 70"><ellipse cx="45" cy="35" rx="42" ry="30" fill="#4a2c1b" transform="rotate(25 45 35)"/><path d="M14 22 C35 40 55 28 76 48" stroke="#140a05" stroke-width="5" fill="none" stroke-linecap="round"/></svg>

  <div class="floor"></div>
  <div class="cupwrap"><img src="cup.png" alt=""></div>

  <!-- foreground beans -->
  <svg class="bean" style="left:-20px;top:1000px;filter:blur(9px);opacity:.95" width="200" height="155" viewBox="0 0 90 70"><ellipse cx="45" cy="35" rx="42" ry="30" fill="#2c180e" transform="rotate(30 45 35)"/><path d="M14 22 C35 40 55 28 76 48" stroke="#0c0503" stroke-width="5" fill="none"/></svg>
  <svg class="bean" style="left:900px;top:1060px;filter:blur(6px);opacity:.95" width="170" height="130" viewBox="0 0 90 70"><ellipse cx="45" cy="35" rx="42" ry="30" fill="#331c10" transform="rotate(-35 45 35)"/><path d="M14 46 C35 30 50 42 76 22" stroke="#0c0503" stroke-width="5" fill="none"/></svg>

  <div class="sticker">POV: YOUR NEW<br>OBSESSION</div>

  <div class="price"><small>ONLY</small><strong>3.00<em>€</em></strong></div>

  <div class="script">Cappuccino<span>.</span></div>

  <div class="tag"><b>ESPRESSO YOURSELF</b>Ice-cold espresso. Velvet foam.</div>
  <div class="cta">GRAB YOURS →</div>

  <div class="grain"></div>
</div>
</body></html>
